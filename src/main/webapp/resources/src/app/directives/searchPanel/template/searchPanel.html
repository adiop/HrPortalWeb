<div class="row" ng-if="paginatedResult !== undefined">

    <div class="col-lg-12" ng-if="paginatedResult.isEmpty()">

        <div class="row">
            <div class="col-12">
                <div class="alert alert-danger m-1" role="alert">
                    <h4><i class="fa fa-exclamation-triangle fa-2x"></i> No results found for the criteria!</h4>
                </div>
            </div>
        </div>

    </div>

    <div class="col-lg-12" ng-if="!paginatedResult.isEmpty()">

        <div class="card">

            <div class="card-header">

                <div class="row">
                    <div class="col-sm-6">
                        <strong>Found {{paginatedResult.size}} Results</strong>
                    </div>
                    <div class="col-sm-6 text-right">
                        <button class="btn btn-primary" ng-click="paginatedResult.previous()">
                            <i class="fa fa-backward fa-1x"></i>
                        </button>
                        <strong>&nbsp;&nbsp;Page {{paginatedResult.actualPage}} of {{paginatedResult.totalPages}}&nbsp;&nbsp;</strong>
                        <button class="btn btn-primary" ng-click="paginatedResult.next()">
                            <i class="fa fa-forward fa-1x"></i>
                        </button>
                    </div>
                </div>

            </div>

            <!-- content -->
            <div class="card-body" ng-transclude="content"></div>

            <div class="card-footer">

                <div class="row">
                    <div class="col-sm-6">
                        <strong>Found {{paginatedResult.size}} Results</strong>
                    </div>
                    <div class="col-sm-6 text-right">
                        <button class="btn btn-primary" ng-click="paginatedResult.previous()">
                            <i class="fa fa-backward fa-1x"></i>
                        </button>
                        <strong>&nbsp;&nbsp;Page {{paginatedResult.actualPage}} of {{paginatedResult.totalPages}}&nbsp;&nbsp;</strong>
                        <button class="btn btn-primary" ng-click="paginatedResult.next()">
                            <i class="fa fa-forward fa-1x"></i>
                        </button>
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>
