<!-- Insert Modal -->
<modal modal-id="'insertModal'" modal-title="'Insert a New Department'">

    <modal-content>

        <form name="insertForm" class="validateForm">


            <div class="row">

                <!-- Name -->
                <div class="col-lg-8">
                    <div class="form-group">
                        <label>Name:</label>
                        <input type="text" name="name" class="form-control required" ng-model="ctrl.insert.form.name" autocomplete="off" ng-required="true" autocomplete="off">
                        <div role="alert" ng-messages="insertForm.name.$error" role="alert">
                            <div class="text-danger" ng-message="required">The name is required</div>
                        </div>
                    </div>
                </div>
                <!-- Name -->

                <!-- Department Code -->
                <div class="col-lg-4">
                    <div class="form-group">
                        <div class="form-group">
                            <label>JDE Department Code:</label>
                            <input type="text" name="departmentCode" class="form-control required" ng-model="ctrl.insert.form.departmentCode" autocomplete="off" ng-required="true">
                            <div role="alert" ng-messages="insertForm.departmentCode.$error" role="alert">
                                <div class="text-danger" ng-message="required">The JDE Code is required</div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Department Code -->

            </div>

            <div class="form-group">
                <label for="insertDescription">Description:</label>
                <textarea type="text" name="insertDescription" class="form-control" id="insertDescription" ng-model="ctrl.insert.form.description"></textarea>
            </div>

        </form>

        <init-form ng-init="ctrl.insertForm = insertForm" />

    </modal-content>

    <modal-footer>

        <button type="button" class="btn btn-danger" data-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" data-dismiss="modal" ng-click="ctrl.insert.do()" ng-disabled="!ctrl.insertForm.$valid">Insert</button>

    </modal-footer>

</modal>
<!-- Insert Modal -->
