<!-- Hire Modal -->
<modal modal-id="'hireModal'" modal-title="'Hire Temporary'">

        <modal-content>

            <!-- Hire temporary -->
            <form name="hireForm" class="validateForm">

                <!-- Personal Information -->
                <fieldset class="border rounded p-3">

                    <legend>Personal Information</legend>

                    <div  ng-show="ctrl.hire.form.image" class="row pb-2">
                        <div class="col-md-2">
                            <img src="{{ctrl.hire.form.image}}" class="img-thumbnail">
                        </div>
                        <div class="col-md-10">
                        </div>
                    </div>

                    <!-- Name -->
                    <div class="form-group">
                        <label>Name:</label>
                       {{ctrl.hire.form.preferredName}} {{ctrl.hire.form.lastName}}
                    </div>
                    <!-- Name -->

                </fieldset>

                <!-- Temporary Information -->
                <fieldset class="border rounded p-3 mt-3">

                    <legend>Temporary Information</legend>

                    <!-- Shift and Key Card Number -->
                    <div class="form-row">

                        <!-- Shift -->
                        <div class="col-md-4  mb-3">
                            <label>Shift:</label>
                            <select name="shift" class="form-control" ng-model="ctrl.hire.form.shift" ng-disabled="true">
                                <option value="DAY_5_8">Day 5 x 8</option>
                                <option value="DAY_4_10">Day 4 x 10 </option>
                                <option value="SWING_5_8">Swing 5 x 8</option>
                                <option value="SWING_4_10">Swing 4 x 10</option>
                            </select>
                        </div>
                        <!-- Shift -->

                        <!-- Temporary Number -->
                        <div class="col-md-4  mb-3">
                            <label>Temporary Number:</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">1</span>
                                </div>
                                <input type="text" name="temporaryNumber" class="form-control required" ng-model="ctrl.hire.form.temporaryNumber" ng-readonly="true">
                            </div>
                        </div>
                        <!-- Temporary Number -->

                        <!-- Login -->
                        <div class="col-md-4  mb-3">
                            <label>Login:</label>
                            <input type="text" name="login" class="form-control" ng-model="ctrl.hire.form.login" ng-readonly="true">
                        </div>
                        <!-- Login -->

                    </div>
                    <!-- Shift and Key Card Number -->

                    <!-- Manager -->
                    <div class="form-group" ng-show="ctrl.hire.form.manager">

                        <label>Manager: </label>

                        <show-temporary-selected temporary="ctrl.hire.form.manager"></show-temporary-selected>

                    </div>
                    <!-- Manager -->

                    <!-- Department -->
                    <div class="form-group">
                        <label>Department:</label>
                        <select class="form-control" ng-model="ctrl.hire.form.department" ng-options="department as department.label for department in ctrl.hire.form.departmentList track by department.value" ng-disabled="true">
                        </select>
                        <input type="hidden" name="department" ng-model="ctrl.hire.form.department.value" ng-required="true">
                        <div role="alert" ng-messages="updateForm.department.$error" role="alert">
                            <div class="text-danger" ng-message="required">The department is required</div>
                        </div>
                    </div>
                    <!-- Department -->

                    <!-- Job Title -->
                    <div class="form-group">
                        <label>Job Title:</label>
                        <select class="form-control" ng-model="ctrl.hire.form.jobTitle" ng-options="jobTitle as jobTitle.label for jobTitle in ctrl.hire.form.jobTitleList track by jobTitle.value" ng-disabled="true">
                        </select>
                    </div>
                    <!-- Job Title -->

                </fieldset>

                <!-- Temporary Information -->
                <fieldset class="border rounded p-3 mt-3">

                    <legend>Hire Date</legend>

                    <div class="form-group">
                        <label>Hire Date:</label>
                        <input type="date" name="hireDate" class="form-control" ng-model="ctrl.hire.form.hireDate" ng-required="true">
                        <div role="alert" ng-messages="hireForm.hireDate.$error" >
                            <div class="text-danger" ng-message="required">The hire date is required</div>
                        </div>
                        <div role="alert" ng-show="ctrl.hire.form.hireDate < ctrl.hire.form.now">
                            <div class="text-danger">The hire date must be greater or equal today</div>
                        </div>
                    </div>

                </fieldset>

            </form>

        </modal-content>

    <modal-footer>

        <!-- Buttons - Cancel and update -->
        <div>
            <button type="button" class="btn btn-danger" data-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" data-dismiss="modal" ng-click="ctrl.hire.do()">Hire</button>
        </div>
        <!-- Buttons - Cancel and update -->

    </modal-footer>

<!-- Hire Modal -->
