<!-- Reassign Modal -->
<modal modal-id="'reassignModal'" modal-title="'Reassign the ticket'">

    <modal-content>

        <div class="form-group" ng-show="ctrl.technician">

            <label>Technician: </label>

            <show-employee-selected employee="ctrl.technician"></show-employee-selected>

        </div>

        <div class="form-group">

            <label>Select the new Technician: </label>

            <employee-selector holder="ctrl" on-select="ctrl.selectTechnician(form, selectedEmployee)">
            </employee-selector>

        </div>

        <!-- Reason -->
        <div class="form-group">
            <label>Reason:</label>
            <textarea name="comments" class="form-control" ng-model="ctrl.reassignReason" rows="5" ></textarea>
        </div>
        <!-- Reason -->

    </modal-content>

    <modal-footer>

        <button type="button" class="btn btn-danger" data-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" data-dismiss="modal" ng-click="ctrl.reassignTicket(ctrl.technician, ctrl.reassignReason)" ng-disabled="ctrl.technician === null || ctrl.reassignReason === ''">Reassign</button>

    </modal-footer>

</modal>
<!-- Reassign Modal -->
