<!-- Update Modal -->
<modal modal-id="'updateModal'" modal-title="'Update Staff Resource'" loading="ctrl.update.form.loading">

    <modal-content>

        <form name="updateForm">

            <!-- Name -->
            <div class="form-group">
                <label>Name:</label>
                <input type="text" name="name" class="form-control required" ng-model="ctrl.update.form.name" ng-required="true" autocomplete="off">
                <div role="alert" ng-messages="updateForm.name.$error" role="alert">
                    <div class="text-danger" ng-message="required">The name is required</div>
                </div>
            </div>
            <!-- Name -->

            <!-- Type -->
            <div class="form-group">
                <label>Type:</label>
                <select name="type" class="form-control" ng-model="ctrl.update.form.type" ng-required="true" ng-options="type as type.label for type in ctrl.insert.form.typeList  track by type.value">
                </select>
                <div role="alert" ng-messages="updateForm.type.$error" role="alert">
                    <div class="text-danger" ng-message="required">The type is required</div>
                </div>
            </div>
            <!-- Type -->

            <!-- Default -->
            <div class="form-group">
                <label>Default:</label>
                <select name="type" class="form-control" ng-model="ctrl.update.form.defaultResource" ng-options="defaultResource as defaultResource.label for defaultResource in ctrl.update.form.defaultResourceList  track by defaultResource.value">
                </select>
            </div>
            <!-- Default -->

            <!-- Technician -->
            <div class="form-group" ng-show="ctrl.update.form.technician">

                <label>Technician: </label>

                <show-employee-selected employee="ctrl.update.form.technician"></show-employee-selected>

            </div>

            <div class="form-group">
                <label>Select a Technician: </label>

                <employee-selector holder="ctrl.update.form" on-select="ctrl.selectTechnician(form, selectedEmployee)">
                </employee-selector>

                <input type="hidden" name="technician" ng-model="ctrl.update.form.technician" ng-required="true">
                <div role="alert" ng-messages="updateForm.technician.$error" role="alert">
                    <div class="text-danger" ng-message="required">The Technician is required</div>
                </div>

            </div>
            <!-- Technician -->

            <!-- Description -->
            <div class="row">
                <div class="col-lg-12">
                    <div class="form-group">
                        <label for="updateDescription">Description:</label>
                        <textarea type="text" name="updateDescription" class="form-control" id="updateDescription" ng-model="ctrl.update.form.description"></textarea>
                    </div>
                </div>
            </div>
            <!-- Description -->

        </form>

        <init-form ng-init="ctrl.updateForm = updateForm" />

    </modal-content>

    <modal-footer>

        <button type="button" class="btn btn-danger" data-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" data-dismiss="modal" ng-click="ctrl.update.do()" ng-disabled="!ctrl.updateForm.$valid">Update</button>

    </modal-footer>

</modal>
<!-- Update Modal -->
