group 'com.warn.hr'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:2.0.1.RELEASE")
    }
}

apply plugin: 'java'
apply plugin: 'war'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

sourceCompatibility = 1.8
targetCompatibility = 1.8

//bootRepackage.enabled = false

repositories {
    mavenCentral()
}

dependencies {

    //Spring
    compile group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: '2.0.3.RELEASE'

    // Spring orm
    compile group: 'org.springframework', name: 'spring-orm', version: '5.0.2.RELEASE'

    //Hibernate
    compile group: 'org.hibernate', name: 'hibernate-core', version: '5.2.16.Final'

    // https://mvnrepository.com/artifact/net.sourceforge.jtds/jtds
    compile group: 'net.sourceforge.jtds', name: 'jtds', version: '1.3.1'

    //Javaslang
    compile 'io.javaslang:javaslang:2.0.0'

    //Webjars
    compile('org.webjars:bootstrap:4.1.0')
    compile('org.webjars:jquery:3.2.1')
    compile('org.webjars:angularjs:1.6.6')
    compile('org.webjars:angular-material:1.1.5')

    //Freemarker
    compile group: 'org.freemarker', name: 'freemarker', version: '2.3.28'

    // org.apache.poi/poi and org.apache.poi/poi-ooxml
    compile group: 'org.apache.poi', name: 'poi', version: '3.9'
    compile group: 'org.apache.poi', name: 'poi-ooxml', version: '3.9'

    // Apache Commons-IO
    compile group: 'commons-io', name: 'commons-io', version: '2.6'

    // Apache commons-lang3
    compile group: 'org.apache.commons', name: 'commons-lang3', version: '3.8'

    //Web sockets
    compile("org.springframework.boot:spring-boot-starter-websocket")

    //Web sockets
    compile("org.springframework.boot:spring-boot-starter-aop")

    // https://mvnrepository.com/artifact/org.webjars/stomp-websocket
    compile group: 'org.webjars', name: 'stomp-websocket', version: '2.3.1'

    // https://mvnrepository.com/artifact/org.webjars/sockjs-client
    compile group: 'org.webjars', name: 'sockjs-client', version: '1.1.2'

    //Lombok
    compileOnly 'org.projectlombok:lombok:1.18.4'

    //Openfeign
    compile group: 'io.github.openfeign', name: 'feign-okhttp', version: '10.5.1'
    compile group: 'io.github.openfeign', name: 'feign-gson', version: '10.5.1'
    compile group: 'io.github.openfeign', name: 'feign-jackson', version: '10.5.1'
    compile group: 'io.github.openfeign', name: 'feign-slf4j', version: '10.5.1'

    testCompile group: 'junit', name: 'junit', version: '4.12'

    //Spring Boot test
    testCompile group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: '2.0.3.RELEASE'

}
